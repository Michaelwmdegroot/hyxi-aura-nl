name: HYXI AURA — Public production readiness

on:
  push:
    branches: [main]
  schedule:
    - cron: '21 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyxi-aura-public-readiness
  cancel-in-progress: false

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out probe
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only public production checks
        run: node scripts/probe-production.mjs
