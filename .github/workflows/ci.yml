name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production build, API and browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production assets
        id: build
        run: npm run build

      - name: Test models and the secured lead API
        run: npm test

      - name: Check SEO, links, assets and public build contents
        run: npm run check

      - name: Install Playwright Chromium and system dependencies
        id: chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify desktop, mobile and accessible browser journeys
        timeout-minutes: 10
        run: npm run test:browser

      - name: Measure Lighthouse on desktop and mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        timeout-minutes: 8
        run: node scripts/audit.mjs

      - name: Upload Lighthouse audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  production-install:
    name: Hostinger-style production-only install + build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: production

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install only production dependencies (same as Hostinger)
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Build without development dependencies
        run: |
          test -x node_modules/.bin/vite
          npm run build
          npm run check

      - name: Smoke test production entry both ways Hostinger may start it
        run: node scripts/runtime-smoke.mjs

  mysql-integration:
    name: MySQL 8 transactional lead storage and outbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-root-only
          MYSQL_DATABASE: aura_ci
          MYSQL_USER: aura_ci
          MYSQL_PASSWORD: local-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: aura_ci
      DB_USER: aura_ci
      DB_PASSWORD: local-ci-only-password
      DB_SCHEMA_APPLY: explicit-review-completed
      LEAD_STORAGE_MODE: database
      LEAD_ENABLED: "true"
      LEAD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LEAD_HASH_SECRET: local-ci-only-hmac-secret-at-least-thirty-two-bytes
      SMTP_HOST: smtp.example.test
      SMTP_USER: sender@example.test
      SMTP_PASS: local-ci-no-real-smtp
      SMTP_FROM: sender@example.test
      LEAD_TO: leads@example.test
      SITE_URL: https://hyxi-aura.nl

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Integration tests using an isolated MySQL service
        run: npm run test:db
